<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masonry Layout Showcase</title>
  <meta name="description" content="A responsive masonry layout showcase built with Isotope.js, featuring dark/light themes, multiple content types, and interactive controls.">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <script src="assets/js/isotope.pkgd.min.js"></script>
  <script src="assets/js/imagesloaded.pkgd.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light dark;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-card: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent: #4a90d9;
      --accent-hover: #357abd;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 0.125rem 0.75rem rgba(0, 0, 0, 0.08);
      --panel-bg: rgba(255, 255, 255, 0.85);
      --panel-border: rgba(0, 0, 0, 0.1);
      --overlay-bg: rgba(0, 0, 0, 0.5);
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
      --transition: 0.3s ease;
      --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: rgba(255, 255, 255, 0.06);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0b0;
      --accent: #6c9fd8;
      --accent-hover: #5a8dc0;
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 0.125rem 0.75rem rgba(0, 0, 0, 0.3);
      --panel-bg: rgba(30, 30, 50, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --overlay-bg: rgba(0, 0, 0, 0.7);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    html::-webkit-scrollbar {
      width: 6px;
    }

    html::-webkit-scrollbar-track {
      background: transparent;
    }

    html::-webkit-scrollbar-thumb {
      background: rgba(128, 128, 128, 0.3);
      border-radius: 3px;
    }

    html::-webkit-scrollbar-thumb:hover {
      background: rgba(128, 128, 128, 0.5);
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(128, 128, 128, 0.3) transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color var(--transition), color var(--transition);
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .title-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      background: var(--panel-bg);
      backdrop-filter: blur(0.75rem);
      -webkit-backdrop-filter: blur(0.75rem);
      border-bottom: 1px solid var(--panel-border);
      text-align: center;
      transform: translateY(0);
      transition: transform 0.4s ease;
    }

    .title-overlay.hidden {
      transform: translateY(-100%);
    }

    .title-overlay h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .masonry-grid {
      position: relative;
      padding: 5rem 1.5rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      overflow: hidden;
    }

    .masonry-item {
      width: calc(25% - 0.75rem);
      margin-bottom: 0.5rem;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: box-shadow var(--transition), background-color var(--transition);
      will-change: transform;
    }

    .masonry-item:hover {
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.15);
    }

    .masonry-item.grid-mode {
      height: 220px;
    }

    .masonry-item.grid-mode.image-card img {
      height: 100%;
      object-fit: cover;
    }

    .masonry-item.grid-mode.text-card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .masonry-item.grid-mode.text-card p {
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    @media (max-width: 639px) {
      .masonry-item.grid-mode {
        height: 180px;
      }

      .masonry-grid {
        padding: 4.375rem 0.75rem 0.75rem;
        overflow: hidden;
      }

      .control-panel {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-width: 100vw;
        border-radius: var(--radius) var(--radius) 0 0;
        max-height: 50vh;
        box-sizing: border-box;
      }

      .control-toggle {
        bottom: 1rem;
        right: 1rem;
      }
    }

    .masonry-item.image-card picture {
      display: block;
    }

    .masonry-item.image-card img {
      width: 100%;
      display: block;
      transition: transform 0.5s ease;
    }

    .masonry-item.image-card:hover img {
      transform: scale(1.03);
    }

    .masonry-item.image-card .image-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      color: #fff;
      opacity: 0;
      transform: translateY(0.5rem);
      transition: opacity var(--transition), transform var(--transition);
    }

    .masonry-item.image-card {
      position: relative;
    }

    .masonry-item.image-card:hover .image-overlay {
      opacity: 1;
      transform: translateY(0);
    }

    .masonry-item.image-card .image-overlay h3 {
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .masonry-item.image-card .image-overlay .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(0.25rem);
    }

    .masonry-item.text-card {
      padding: 1.25rem;
    }

    .masonry-item.text-card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .masonry-item.text-card p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .masonry-item .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .masonry-item .card-meta .tag {
      font-size: 0.7rem;
      padding: 0.1875rem 0.625rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 500;
    }

    .masonry-item .card-meta .date {
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .control-toggle {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 200;
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(0.75rem);
      -webkit-backdrop-filter: blur(0.75rem);
      box-shadow: var(--shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--text-primary);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .control-toggle:hover {
      transform: scale(1.08);
      box-shadow: 0 0.25rem 1rem rgba(0, 0, 0, 0.2);
    }

    .control-panel {
      position: fixed;
      bottom: 5.25rem;
      right: 1.5rem;
      z-index: 200;
      width: 17.5rem;
      max-height: 70vh;
      overflow-y: auto;
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      backdrop-filter: blur(1rem);
      -webkit-backdrop-filter: blur(1rem);
      box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(1rem) scale(0.95);
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
    }

    .control-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .control-panel h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 0.625rem;
      margin-top: 1rem;
    }

    .control-panel h3:first-child {
      margin-top: 0;
    }

    .control-group {
      margin-bottom: 1rem;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    .theme-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-switch span {
      font-size: 0.85rem;
    }

    .toggle-track {
      position: relative;
      width: 2.75rem;
      height: 1.5rem;
      background: var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: background var(--transition);
    }

    .toggle-track.active {
      background: var(--accent);
    }

    .toggle-thumb {
      position: absolute;
      top: 0.125rem;
      left: 0.125rem;
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 50%;
      background: #fff;
      transition: transform var(--transition);
      box-shadow: 0 0.0625rem 0.1875rem rgba(0, 0, 0, 0.2);
    }

    .toggle-track.active .toggle-thumb {
      transform: translateX(1.25rem);
    }

    .pill-group {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 0.3125rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-sans);
    }

    .pill-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .range-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 0.25rem;
      border-radius: 0.125rem;
      background: var(--border);
      outline: none;
      margin-top: 0.5rem;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0.0625rem 0.25rem rgba(0, 0, 0, 0.2);
    }

    .range-slider::-moz-range-thumb {
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
    }

    .range-value {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      text-align: right;
    }

    @media (max-width: 639px) {
      .control-panel {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        border-radius: var(--radius) var(--radius) 0 0;
        max-height: 50vh;
      }

      .control-toggle {
        bottom: 1rem;
        right: 1rem;
      }
    }

    :focus-visible {
      outline: 0.125rem solid var(--accent);
      outline-offset: 0.125rem;
    }

    .pill-btn:focus-visible,
    .control-toggle:focus-visible {
      outline: 0.125rem solid var(--accent);
      outline-offset: 0.125rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

    <h1>Masonry Layout Showcase</h1>

  <main class="masonry-grid" id="masonryGrid"></main>

    </svg>
  </button>

  <div class="control-panel" id="controlPanel">
    <h3>Theme</h3>
    <div class="control-group">
      <div class="theme-switch">
        <span id="themeLabel">Light</span>
        <div class="toggle-track" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle dark mode" tabindex="0">
          <div class="toggle-thumb"></div>
        </div>
      </div>
    </div>

    <h3>Content</h3>
    <div class="control-group">
      <div class="pill-group" id="contentPills">
        <button class="pill-btn active" data-content="gallery">Gallery</button>
        <button class="pill-btn" data-content="cards">Cards</button>
        <button class="pill-btn" data-content="mixed">Mixed</button>
      </div>
    </div>

    <h3>Columns</h3>
    <div class="control-group">
      <input type="range" class="range-slider" id="columnSlider" min="2" max="5" value="4" aria-label="Number of columns">
      <div class="range-value"><span id="columnValue">4</span> columns</div>
    </div>

    <h3>Layout</h3>
    <div class="control-group">
      <div class="pill-group" id="layoutPills">
        <button class="pill-btn active" data-layout="masonry">Masonry</button>
        <button class="pill-btn" data-layout="fitRows">FitRows</button>
        <button class="pill-btn" data-layout="grid">Grid</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var html = document.documentElement;
      var savedTheme = localStorage.getItem('masonry-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var currentTheme = savedTheme || (prefersDark ? 'dark' : 'light');

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        currentTheme = theme;
        var toggle = document.getElementById('themeToggle');
        var label = document.getElementById('themeLabel');
        if (theme === 'dark') {
          toggle.classList.add('active');
          toggle.setAttribute('aria-checked', 'true');
          label.textContent = 'Dark';
        } else {
          toggle.classList.remove('active');
          toggle.setAttribute('aria-checked', 'false');
          label.textContent = 'Light';
        }
      }

      applyTheme(currentTheme);

      document.getElementById('themeToggle').addEventListener('click', function () {
        var next = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem('masonry-theme', next);
      });

      document.getElementById('themeToggle').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.click();
        }
      });
    })();

    (function () {
      var toggle = document.getElementById('controlToggle');
      var panel = document.getElementById('controlPanel');
      var isOpen = false;

      function closePanel() {
        isOpen = false;
        panel.classList.remove('open');
      }

      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        isOpen = !isOpen;
        panel.classList.toggle('open', isOpen);
      });

      panel.addEventListener('click', function (e) {
        e.stopPropagation();
      });

      document.addEventListener('click', function () {
        if (isOpen) closePanel();
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen) closePanel();
      });
    })();

    (function () {
      var overlay = document.getElementById('titleOverlay');
      var lastScrollY = 0;
      var ticking = false;

      window.addEventListener('scroll', function () {
        if (!ticking) {
          window.requestAnimationFrame(function () {
            var currentScrollY = window.scrollY;
            if (currentScrollY > lastScrollY && currentScrollY > 80) {
              overlay.classList.add('hidden');
            } else {
              overlay.classList.remove('hidden');
            }
            lastScrollY = currentScrollY;
            ticking = false;
          });
          ticking = true;
        }
      });
    })();

        { id: 'card-9', type: 'card', title: 'Fitness Brand Launch', category: 'Branding', date: '2024-07-10', description: 'Full brand launch for a premium fitness brand.' },
        { id: 'card-10', type: 'card', title: 'Task Management Tool', category: 'Development', date: '2024-06-28', description: 'Collaborative project management tool with Kanban boards, time tracking, and team analytics. Drag-and-drop interface with real-time sync across devices. Supports custom workflows, automated sprint planning, burndown chart generation, and Slack/Teams integration for status updates. The backend uses CRDTs for conflict-free offline editing, and the frontend renders complex board states in under 16ms using virtualized list rendering.' },
        { id: 'card-11', type: 'card', title: 'Music Festival Poster', category: 'Design', date: '2024-05-15', description: 'Vibrant poster series for an international music festival. Bold typography meets psychedelic illustration, inspired by vintage concert posters with a modern twist. Each poster in the 8-piece series features a different headliner rendered in a distinct color palette derived from the artist\'s album artwork, while maintaining visual cohesion through a shared grid system and typographic hierarchy. Printed as limited-edition screen prints on archival cotton paper.' },
        { id: 'card-12', type: 'card', title: 'SaaS Product Naming', category: 'Branding', date: '2024-04-03', description: 'Strategic naming and brand positioning for a B2B SaaS product.' }
      ];

      window.MasonryData = DATA;
    })();

    (function () {
      function getResponsiveImageSources(imageUrl) {
        var lastDot = imageUrl.lastIndexOf('.');
        var basePath = imageUrl.slice(0, lastDot);
        var fileName = basePath.slice(basePath.lastIndexOf('/') + 1);
        var responsiveBase = 'assets/images/responsive/' + fileName;
        return {
          avif800: responsiveBase + '-800.avif',
          avif1200: responsiveBase + '-1200.avif',
          webp800: responsiveBase + '-800.webp',
          webp1200: responsiveBase + '-1200.webp',
          jpg800: responsiveBase + '-800.jpg',
          jpg1200: responsiveBase + '-1200.jpg'
        };
      }

      function createResponsiveImageMarkup(item) {
        var sources = getResponsiveImageSources(item.imageUrl);
        var sizes = '(max-width: 639px) 50vw, (max-width: 1023px) 50vw, 25vw';
        return (
          '<picture>' +
            '<source type="image/avif" srcset="' + sources.avif800 + ' 800w, ' + sources.avif1200 + ' 1200w" sizes="' + sizes + '">' +
            '<source type="image/webp" srcset="' + sources.webp800 + ' 800w, ' + sources.webp1200 + ' 1200w" sizes="' + sizes + '">' +
            '<img src="' + sources.jpg1200 + '" srcset="' + sources.jpg800 + ' 800w, ' + sources.jpg1200 + ' 1200w" sizes="' + sizes + '" alt="' + item.title + '" loading="lazy" decoding="async">' +
          '</picture>'
        );
      }

      function createItemElement(item) {
        var article = document.createElement('article');
        article.className = 'masonry-item ' + (item.type === 'image' ? 'image-card' : 'text-card');
        article.setAttribute('data-type', item.type);
        article.setAttribute('data-category', item.category.toLowerCase());

        if (item.type === 'image') {
          article.innerHTML =
            createResponsiveImageMarkup(item) +
            '<div class="image-overlay">' +
            '<h3>' + item.title + '</h3>' +
            '<span class="tag">' + item.category + '</span>' +
            '</div>';
        } else {
          article.innerHTML =
            '<h3>' + item.title + '</h3>' +
            '<p>' + item.description + '</p>' +
            '<div class="card-meta">' +
            '<span class="tag">' + item.category + '</span>' +
            '<span class="date">' + formatDate(item.date) + '</span>' +
            '</div>';
        }

        return article;
      }

      function formatDate(dateStr) {
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var parts = dateStr.split('-');
        return months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
      }

      window.createItemElement = createItemElement;
    })();

    (function () {
      var grid = document.getElementById('masonryGrid');
      var data = window.MasonryData;
      var iso = null;
      var currentContent = 'gallery';
      var currentLayout = 'masonry';

      function getGap() {
        return window.innerWidth < 640 ? 8 : 16;
      }

      function getIsotopeLayoutMode(layoutMode) {
        return layoutMode === 'grid' ? 'fitRows' : layoutMode;
      }

      function getColumnWidth() {
        var slider = document.getElementById('columnSlider');
        var cols = parseInt(slider.value, 10);
        var gap = 16;
        return (grid.offsetWidth - gap * (cols - 1)) / cols;
      }

      function getFilteredItems(mode) {
        if (mode === 'gallery') return data.filter(function (d) { return d.type === 'image'; });
        if (mode === 'cards') return data.filter(function (d) { return d.type === 'card'; });
        var images = data.filter(function (d) { return d.type === 'image'; });
        var cards = data.filter(function (d) { return d.type === 'card'; });
        var result = [];
        var i = 0;
        while (i < images.length || i < cards.length) {
          if (i < images.length) result.push(images[i]);
          if (i < cards.length) result.push(cards[i]);
          i++;
        }
        return result;
      }

      function renderGrid(items) {
        grid.innerHTML = '';
        items.forEach(function (item) {
          grid.appendChild(window.createItemElement(item));
        });
      }

      function applyLayoutState() {
        grid.classList.remove('layout-masonry', 'layout-fitRows', 'layout-grid');
        grid.classList.add('layout-' + currentLayout);

        var items = grid.querySelectorAll('.masonry-item');
        if (currentLayout === 'grid') {
          items.forEach(function (el) { el.classList.add('grid-mode'); });
        } else {
          items.forEach(function (el) { el.classList.remove('grid-mode'); });
        }
      }

      function syncIsotopeOptions() {
        if (!iso) return;
        iso.options.layoutMode = getIsotopeLayoutMode(currentLayout);
        iso.options.masonry.gutter = getGap();
        iso.options.fitRows.gutter = getGap();
      }

      function updateColumnWidth() {
        var slider = document.getElementById('columnSlider');
        var cols = parseInt(slider.value, 10);
        var items = grid.querySelectorAll('.masonry-item');
        var gap = getGap();

        if (window.innerWidth < 640) {
          cols = 2;
        } else if (window.innerWidth < 1024) {
          cols = 2;
        }

        var gridStyle = window.getComputedStyle(grid);
        var gridPadLeft = parseFloat(gridStyle.paddingLeft);
        var gridPadRight = parseFloat(gridStyle.paddingRight);
        var availableWidth = grid.offsetWidth - gridPadLeft - gridPadRight;

        var width = Math.floor((availableWidth - gap * (cols - 1)) / cols);

        items.forEach(function (el) {
          el.style.width = width + 'px';
          el.style.marginBottom = gap + 'px';
        });
      }

      function initIsotope() {
        renderGrid(getFilteredItems(currentContent));
        applyLayoutState();
        updateColumnWidth();

        imagesLoaded(grid, function () {
          if (iso) {
            iso.reloadItems();
            syncIsotopeOptions();
            iso.arrange();
            return;
          }
          iso = new Isotope(grid, {
            itemSelector: '.masonry-item',
            layoutMode: getIsotopeLayoutMode(currentLayout),
            masonry: {
              columnWidth: '.masonry-item',
              gutter: getGap()
            },
            fitRows: {
              gutter: getGap()
            },
            percentPosition: false,
            transitionDuration: '0.4s'
          });
        });
      }

      window.MasonryApp = {
        iso: function () { return iso; },
        grid: grid,
        data: data,
        getCurrentContent: function () { return currentContent; },
        getCurrentLayout: function () { return currentLayout; },
        getColumnWidth: getColumnWidth,
        getFilteredItems: getFilteredItems,
        renderGrid: renderGrid,
        applyLayoutState: applyLayoutState,
        syncIsotopeOptions: syncIsotopeOptions,
        updateColumnWidth: updateColumnWidth,
        initIsotope: initIsotope,
        setContent: function (c) { currentContent = c; },
        setLayout: function (l) { currentLayout = l; },
        setIso: function (i) { iso = i; }
      };

      initIsotope();
    })();

    (function () {
      var pills = document.querySelectorAll('#contentPills .pill-btn');

      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          pills.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');

          var mode = btn.getAttribute('data-content');
          var app = window.MasonryApp;
          app.setContent(mode);
          app.initIsotope();
        });
      });
    })();

    (function () {
      var slider = document.getElementById('columnSlider');
      var valueDisplay = document.getElementById('columnValue');

      slider.addEventListener('input', function () {
        valueDisplay.textContent = slider.value;
        var app = window.MasonryApp;
        app.updateColumnWidth();
        var iso = app.iso();
        if (iso) {
          app.syncIsotopeOptions();
          iso.arrange();
        }
      });
    })();

    (function () {
      var pills = document.querySelectorAll('#layoutPills .pill-btn');

      pills.forEach(function (btn) {
        btn.addEventListener('click', function () {
          pills.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');

          var layoutMode = btn.getAttribute('data-layout');
          var app = window.MasonryApp;
          app.setLayout(layoutMode);
          app.applyLayoutState();
          app.updateColumnWidth();
          app.syncIsotopeOptions();
          var iso = app.iso();
          if (iso) {
            iso.arrange();
          }
        });
      });
    })();
    (function () {
  var app = window.MasonryApp;

  function handleResize() {
    app.updateColumnWidth();
    var iso = app.iso();
    if (iso) {
      app.syncIsotopeOptions();
      iso.arrange();
    }
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 200);
  });
})();
  </script>
</body>
</html>
