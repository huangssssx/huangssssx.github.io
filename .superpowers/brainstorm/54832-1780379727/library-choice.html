<h2>Masonry 库选择</h2>
<p class="subtitle">确认使用库方案</p>

<div class="section">
  <h3>使用哪个 Masonry 库？</h3>
</div>

<div class="options">
  <div class="option" data-choice="masonryjs" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Masonry.js (desandro)</h3>
      <p>最经典的瀑布流库，GitHub 16k+ stars。纯布局，轻量专注。配合 imagesLoaded 处理图片加载。社区成熟，文档完善。</p>
    </div>
  </div>
  <div class="option" data-choice="isotope" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Isotope (desandro)</h3>
      <p>Masonry.js 的升级版，额外支持筛选、排序、动画过渡。功能更丰富，但体积更大。适合需要交互筛选的场景。</p>
    </div>
  </div>
</div>
