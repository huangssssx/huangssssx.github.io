<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>太阳系 3D · Solar System</title>
  <meta name="description" content="基于 Three.js（WebGL）构建的真 3D 交互式太阳系模型：真球体、物理光照、Bloom 辉光、程序化纹理。" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/ui.css" />

  <!-- Three.js（ES Modules + importmap，CDN 锁定版本） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 加载页 -->
  <div class="loader" id="loader">
    <div class="loader-orbit"><span class="loader-sun"></span><span class="loader-planet"></span></div>
    <p class="loader-text">正在构建太阳系…</p>
  </div>

  <!-- WebGL 画布容器 -->
  <div class="scene" id="scene" aria-label="太阳系三维场景"></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <h1>太阳系 <span>3D</span></h1>
    <p class="subtitle">Three.js · 真 3D 球体 · 物理光照 · Bloom 辉光</p>
  </header>

  <!-- 控制面板 -->
  <nav class="controls" id="controls" aria-label="动画控制">
    <button class="btn" id="btnPlay" type="button" aria-label="暂停或播放">暂停</button>
    <span class="divider"></span>
    <div class="speed-wrap">
      <label for="speed">速度</label>
      <input type="range" id="speed" min="0.1" max="10" step="0.1" value="1" aria-label="动画速度" />
      <span class="speed-val" id="speedVal">1.0×</span>
    </div>
    <span class="divider"></span>
    <button class="btn" id="btnReset" type="button" aria-label="重置视角与时间">重置</button>
  </nav>

  <!-- 信息面板 -->
  <aside class="info-panel" id="infoPanel" aria-live="polite">
    <div class="ip-head">
      <span class="ip-swatch"></span>
      <div>
        <h2 class="ip-name">—</h2>
        <p class="ip-type">—</p>
      </div>
      <button class="btn ip-close" type="button" aria-label="关闭信息面板">×</button>
    </div>
    <div class="ip-data"></div>
    <p class="ip-desc"></p>
  </aside>

  <!-- 操作提示 -->
  <div class="hint">拖拽旋转视角 · 滚轮缩放 · 点击天体查看 · 空格暂停 · R 重置</div>

  <!-- 主程序（ES Module） -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
