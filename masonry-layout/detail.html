<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail</title>
  <meta name="description" content="Detail view for Masonry Layout content items.">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg-primary: #000000;
      --bg-card: rgba(255, 255, 255, 0.04);
      --text-primary: #ffffff;
      --text-secondary: #6d6d6d;
      --text-muted: #636363;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a0e0ab;
      --gradient-deep-ocean: linear-gradient(90deg, rgb(160, 224, 171), rgb(255, 172, 46) 50%, rgb(165, 45, 37));
      --radius: 0.625rem;
      --radius-pill: 4.6875rem;
      --transition: 0.3s ease;
      --font-sans: 'Roobert', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      color: var(--text-primary);
      min-height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--gradient-deep-ocean);
      opacity: 0.15;
      z-index: -2;
      animation: gradientShift 20s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(160, 224, 171, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(255, 172, 46, 0.06) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 90%, rgba(165, 45, 37, 0.06) 0%, transparent 50%);
      z-index: -1;
      animation: orbsFloat 25s ease-in-out infinite alternate;
    }

    @keyframes gradientShift {
      0% { opacity: 0.12; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.2; transform: scale(1.05) rotate(1deg); }
      100% { opacity: 0.15; transform: scale(1) rotate(-1deg); }
    }

    @keyframes orbsFloat {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-1.25rem, 1.875rem); }
      66% { transform: translate(0.9375rem, -1.25rem); }
      100% { transform: translate(-0.625rem, 0.625rem); }
    }

    html::-webkit-scrollbar {
      width: 0.3125rem;
    }

    html::-webkit-scrollbar-track {
      background: transparent;
    }

    html::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 0.1875rem;
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
    }

    .back-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1rem 1.5rem;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(1.25rem);
      -webkit-backdrop-filter: blur(1.25rem);
      border-bottom: 0.0625rem solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 1rem;
      border-radius: var(--radius-pill);
      border: 0.0625rem solid rgba(255, 255, 255, 0.15);
      background: transparent;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      font-family: var(--font-sans);
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: border-color var(--transition), color var(--transition);
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .back-btn svg {
      width: 1rem;
      height: 1rem;
    }

    .detail-content {
      padding-top: 4.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .detail-image-wrap {
      width: 100%;
      max-width: 26.25rem;
      padding: 2rem 1.5rem 0;
      opacity: 0;
      transform: translateY(1.5rem);
      animation: fadeUp 0.6s ease forwards;
    }

    .detail-image-wrap picture {
      display: block;
      width: 100%;
      border-radius: var(--radius);
      overflow: hidden;
      border: 0.0625rem solid var(--border);
    }

    .detail-image-wrap img {
      width: 100%;
      display: block;
      border-radius: var(--radius);
    }

    .detail-info {
      width: 100%;
      max-width: 51.25rem;
      padding: 2rem 1.5rem 4rem;
      opacity: 0;
      transform: translateY(1rem);
      animation: fadeUp 0.6s ease 0.15s forwards;
    }

    .detail-info h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .detail-meta .tag {
      font-size: 0.75rem;
      padding: 0.3rem 1rem;
      border-radius: var(--radius-pill);
      border: 0.0625rem solid rgba(160, 224, 171, 0.3);
      color: var(--accent);
      font-weight: 400;
    }

    .detail-meta .date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .detail-info .description {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--text-secondary);
      line-height: 1.8;
      max-width: 45rem;
    }

    .detail-text-wrap {
      width: 100%;
      max-width: 56.25rem;
      padding: 4rem 1.5rem;
      opacity: 0;
      transform: translateY(1.5rem);
      animation: fadeUp 0.6s ease forwards;
    }

    .detail-text-wrap h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      margin-bottom: 1.25rem;
      line-height: 1.15;
    }

    .detail-text-wrap .detail-meta {
      margin-bottom: 2.5rem;
    }

    .detail-text-wrap .description {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--text-secondary);
      line-height: 1.9;
      max-width: 45rem;
    }

    .not-found {
      text-align: center;
      padding: 6rem 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .not-found h2 {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }

    .not-found a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 0.0625rem solid rgba(160, 224, 171, 0.3);
      transition: border-color var(--transition);
    }

    .not-found a:hover {
      border-color: var(--accent);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 639px) {
      .detail-content {
        padding-top: 4rem;
      }

      .detail-image-wrap {
        padding: 0 0.75rem;
      }

      .detail-info,
      .detail-text-wrap {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }

      .detail-info {
        padding-bottom: 3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var DATA = [
        { id: 'img-1', type: 'image', title: 'Mountain Vista', category: 'Nature', date: '2025-05-10', imageUrl: 'assets/images/img-1.jpg', description: 'A sweeping panoramic view captured at an elevation of 3,200 meters, where layers of mountain ridges fade into atmospheric haze. The foreground reveals alpine meadows dotted with wildflowers, while distant peaks retain traces of seasonal snow. Shot during the golden hour when warm sidelight sculpted every ridge and valley with long, soft shadows, lending the scene a quiet grandeur that shifts minute by minute as the sun descends.' },
        { id: 'img-2', type: 'image', title: 'Urban Geometry', category: 'Architecture', date: '2025-04-22', imageUrl: 'assets/images/img-2.jpg', description: 'An abstract composition formed by the converging lines of a modern glass-and-steel complex, photographed from directly below looking upward. Reflective facades mirror adjacent buildings and passing clouds, creating a visual collage where structure and sky dissolve into one another. The rigid orthogonals of beams and mullions contrast with the organic curves of reflected light, turning everyday architecture into a study in symmetry and perception.' },
        { id: 'img-3', type: 'image', title: 'Portrait Study', category: 'People', date: '2025-03-15', imageUrl: 'assets/images/img-3.jpg', description: 'An intimate portrait rendered in soft, diffused window light that wraps gently around the subject\'s features. The shallow depth of field isolates the face against a muted backdrop, drawing attention to subtle expressions—a half-smile, a contemplative gaze directed just beyond the frame. Natural skin tones and minimal retouching preserve the authenticity of the moment, while a warm color grade adds an understated emotional resonance.' },
        { id: 'img-4', type: 'image', title: 'Culinary Art', category: 'Food', date: '2025-02-28', imageUrl: 'assets/images/img-4.jpg', description: 'A meticulously plated dish photographed from a top-down angle, revealing the chef\'s careful arrangement of color, texture, and negative space. Vibrant micro-herbs punctuate earthy sauces, while a dusting of powdered spice traces a deliberate arc across the matte ceramic surface. Directional side lighting casts soft shadows that give each element subtle dimension, transforming the plate into a canvas where gastronomy meets graphic design.' },
        { id: 'img-5', type: 'image', title: 'Coastal Serenity', category: 'Travel', date: '2025-01-14', imageUrl: 'assets/images/img-5.jpg', description: 'A long-exposure seascape where turbulent waves have been smoothed into silky sheets of mist that spill over weathered volcanic rocks. The horizon sits low in the frame, giving prominence to a sky painted in soft pastels—lavender bleeding into peach and pale gold. A lone wooden jetty stretches into the frame, providing a leading line that anchors the composition and invites the viewer to step into the tranquil stillness of early morning.' },
        { id: 'img-6', type: 'image', title: 'Forest Canopy', category: 'Nature', date: '2024-12-20', imageUrl: 'assets/images/img-6.jpg', description: 'Looking straight up through a dense canopy of ancient broadleaf trees, their trunks converging like the pillars of a natural cathedral. Dappled sunlight filters through countless layers of foliage, creating a luminous mosaic of greens that ranges from deep emerald in the shadows to bright chartreuse where beams break through. The vantage point emphasizes the staggering height and age of the forest, evoking a sense of reverence for the slow, persistent force of growth.' },
        { id: 'img-7', type: 'image', title: 'Glass Tower', category: 'Architecture', date: '2024-11-08', imageUrl: 'assets/images/img-7.jpg', description: 'A monolithic glass skyscraper captured in late afternoon light, its curtain wall acting as a massive mirror that reflects the surrounding cityscape in distorted, almost liquid forms. The building\'s taut vertical lines rise cleanly to a tapered crown, while warm reflections of neighboring brick facades create an unexpected color interplay on the cold blue-green glass. A study in how modern materials reshape the visual identity of the streets below.' },
        { id: 'img-8', type: 'image', title: 'Street Moments', category: 'People', date: '2024-10-30', imageUrl: 'assets/images/img-8.jpg', description: 'A candid street scene frozen at the intersection of motion and stillness: a pedestrian mid-stride, a cyclist threading through traffic, a vendor arranging fruit on a weathered cart. The composition layers three distinct planes of activity—foreground, middle ground, and distant facade—each telling its own fragment of the city\'s story. Overcast light softens harsh contrasts, allowing the viewer to wander through every detail without the distraction of deep shadows.' },
        { id: 'img-9', type: 'image', title: 'Artisan Bread', category: 'Food', date: '2024-09-12', imageUrl: 'assets/images/img-9.jpg', description: 'Close-up of a sourdough boule fresh from a stone-hearth oven, its crust crackled and deeply caramelized in shades of mahogany and gold. A gentle tear reveals the open, irregular crumb structure within—large alveoli surrounded by a translucent, slightly glossy interior that speaks to a long, cold fermentation. Flour dust on the cutting board and a scattering of grains provide contextual texture, grounding the image in the craft and patience of traditional baking.' },
        { id: 'img-10', type: 'image', title: 'Alpine Sunrise', category: 'Travel', date: '2024-08-25', imageUrl: 'assets/images/img-10.jpg', description: 'The first rays of sunlight crest a jagged ridge, casting long rosy alpenglow across a glaciated peak while the valley below remains cloaked in indigo shadow. A thin layer of morning mist hugs a mirror-still lake at the composition\'s center, doubling the mountain\'s reflection with near-perfect symmetry. The extreme tonal range—from glowing snow to deep shadow—was carefully balanced to preserve detail across the entire dynamic range of the scene.' },
        { id: 'img-11', type: 'image', title: 'Autumn Path', category: 'Nature', date: '2024-07-18', imageUrl: 'assets/images/img-11.jpg', description: 'A meandering trail disappears beneath an arching tunnel of deciduous trees at peak autumn color—crimson maples flanking amber oaks and golden birches, their fallen leaves blanketing the ground in a thick mosaic. Overcast skies diffuse the light evenly, saturating every hue without harsh highlights. The path\'s gentle curve draws the eye deeper into the scene, suggesting a quiet walk through a landscape transformed briefly into something almost unreal.' },
        { id: 'img-12', type: 'image', title: 'Skyline Dusk', category: 'Architecture', date: '2024-06-05', imageUrl: 'assets/images/img-12.jpg', description: 'A metropolitan skyline silhouetted against the deepening blue of civil twilight, its towers punctuated by the warm glow of office windows and the cool white of navigation lights. The blue-hour palette—cobalt sky, amber reflections on the river, steel-gray silhouettes—creates a restrained harmony. A long exposure smooths the water into a satiny surface that transforms the city\'s vertical rhythm into a shimmering, abstract reflection below.' },
        { id: 'img-13', type: 'image', title: 'Ocean Waves', category: 'Nature', date: '2024-05-12', imageUrl: 'assets/images/img-13.jpg', description: 'A dramatic seascape captured at the precise moment a wave begins to curl, its translucent lip lit from behind by low afternoon sun. Seafoam traces delicate filigree patterns across the water\'s surface, while the receding tide leaves a mirror-like sheen on the dark volcanic sand. A fast shutter speed freezes individual droplets mid-air, suspended between the power of the breaking wave and the pull of gravity.' },
        { id: 'img-14', type: 'image', title: 'Desert Dunes', category: 'Travel', date: '2024-04-18', imageUrl: 'assets/images/img-14.jpg', description: 'Undulating sand dunes stretch to the horizon under a cloudless sky, their wind-sculpted ridgelines forming sinuous curves that separate illuminated slopes from deep shadow. The simplicity of the composition—sand, light, and line—belies the complexity of the micro-landscapes carved into each crest: tiny ripples within larger dunes, themselves part of a vast erg that shifts imperceptibly with every wind. The warm color temperature renders the sand in tones of burnt sienna and pale gold.' },
        { id: 'img-15', type: 'image', title: 'Café Interior', category: 'Food', date: '2024-03-25', imageUrl: 'assets/images/img-15.jpg', description: 'The warm, curated interior of an independent coffee shop, where exposed brick walls meet reclaimed-wood shelving lined with ceramic cups and imported beans. A diagonal shaft of afternoon light enters through a tall window, illuminating a latte whose microfoam art is just beginning to dissolve. The shallow focus isolates the cup and saucer, while the soft background blur reveals baristas at work behind a La Marzocca machine and patrons absorbed in conversation and laptops.' },
        { id: 'img-16', type: 'image', title: 'Bridge at Night', category: 'Architecture', date: '2024-02-14', imageUrl: 'assets/images/img-16.jpg', description: 'A cable-stayed bridge captured after dark, its steel cables forming a fan of light that traces the structure\'s engineered elegance against a deep navy sky. Vehicle headlights paint continuous ribbons of warm white across the roadway in a long exposure, while the bridge\'s architectural lighting casts cool blue reflections on the river below. The interplay of static structure and fluid light transforms familiar infrastructure into an abstract study of motion and engineering.' },
        { id: 'img-17', type: 'image', title: 'Wildflower Field', category: 'Nature', date: '2024-01-22', imageUrl: 'assets/images/img-17.jpg', description: 'A vast meadow erupts in an impressionistic tapestry of wildflowers—cornflowers, poppies, ox-eye daisies, and buttercups—photographed with a telephoto lens that compresses the field into a dense plane of color. A slight breeze introduces controlled motion blur, softening individual blooms into painterly strokes while retaining recognizable shapes. The distant treeline provides a dark horizontal anchor that makes the colors above it vibrate with even greater intensity.' },
        { id: 'img-18', type: 'image', title: 'Vintage Camera', category: 'People', date: '2023-12-30', imageUrl: 'assets/images/img-18.jpg', description: 'A well-worn medium-format film camera rests on a scratched wooden desk, its leather covering patinated by decades of handling. Dappled window light glints off the chrome trim and the polished glass of the viewfinder lens, while the shallow depth of field renders the background—a stack of aged photo albums and a cup of cold coffee—into soft, warm bokeh. Every scratch and scuff on the camera body tells a story of the hands that held it and the moments it witnessed.' },
        { id: 'img-19', type: 'image', title: 'Mountain Lake', category: 'Travel', date: '2023-11-15', imageUrl: 'assets/images/img-19.jpg', description: 'A glacial lake of extraordinary clarity, its surface a perfect mirror reflecting the surrounding peaks and scattered cumulus clouds with barely a ripple. Submerged rocks are visible through meters of transparent water near the shore, their colors shifted toward cyan by the depth. The composition places the horizon precisely at center, creating a meditative symmetry that dissolves the boundary between reality and reflection, earth and sky.' },
        { id: 'img-20', type: 'image', title: 'City Rain', category: 'Architecture', date: '2023-10-08', imageUrl: 'assets/images/img-20.jpg', description: 'Rain-slicked city streets become an improvised canvas of reflected neon and taillight trails, captured through a rain-spattered lens that adds its own layer of atmospheric distortion. Pedestrians huddle under dark umbrellas, their forms rendered as soft silhouettes against the glowing storefronts. The wet asphalt multiplies every light source, transforming an ordinary urban intersection into a luminous, almost dreamlike tableau where every surface shimmers with color.' },
        { id: 'img-21', type: 'image', title: 'Misty Valley', category: 'Nature', date: '2023-09-20', imageUrl: 'assets/images/img-21.jpg', description: 'Morning fog fills a river valley like a slow-moving glacier of white, its surface texture varying from cotton-soft where it catches the first sunlight to deep gray where it pools in the lowest hollows. Tree-covered hills emerge as dark islands from the mist, their forms reduced to simple, layered silhouettes that recede through successive bands of atmospheric perspective. The muted, nearly monochromatic palette emphasizes form and depth over color, evoking a classical ink-wash landscape.' },
        { id: 'img-22', type: 'image', title: 'Bookshop Corner', category: 'People', date: '2023-08-10', imageUrl: 'assets/images/img-22.jpg', description: 'A cozy corner of an independent bookshop, where floor-to-ceiling shelves bow slightly under the weight of countless spines in every shade of muted color. Warm pendant lights cast pools of golden light over reading nooks furnished with worn leather armchairs. A reader is glimpsed in soft focus through a gap in the shelves, absorbed in a volume held close. The air of quiet concentration is palpable, as is the musty-sweet scent of aged paper and binding glue that no photograph can capture but every viewer imagines.' },
        { id: 'img-23', type: 'image', title: 'Sunset Pier', category: 'Travel', date: '2023-07-05', imageUrl: 'assets/images/img-23.jpg', description: 'A weathered wooden pier extends into a calm sea, its parallel planks forming converging lines that lead the eye toward a horizon ablaze with sunset color—bands of coral, tangerine, and magenta layered above a thin strip of residual blue. Silhouetted lamp posts and a solitary figure at the railing anchor the composition against the vast, vivid sky. The long exposure smooths the water into a satiny expanse that reflects and amplifies every hue overhead.' },
        { id: 'img-24', type: 'image', title: 'Greenhouse Light', category: 'Nature', date: '2023-06-01', imageUrl: 'assets/images/img-24.jpg', description: 'Inside a Victorian-era greenhouse, angled glass panels filter sunlight into a lattice of geometric shadows that fall across lush tropical foliage. Water droplets cling to fern fronds and orchid petals, each one a tiny lens refracting the green-tinged light. The cast-iron framework provides a rhythmic structural grid that contrasts with the organic chaos of unchecked plant growth. The humid, light-drenched atmosphere is almost tangible, evoking the quiet industriousness of photosynthesis at work.' },
        { id: 'img-25', type: 'image', title: 'Harbor Reflections', category: 'Architecture', date: '2023-05-18', imageUrl: 'assets/images/img-25.jpg', description: 'A tranquil harbor at dusk where moored sailboats and fishing vessels rest in perfectly still water, their masts and rigging reflected with sharp precision. The harbor-side buildings—a row of pastel-painted facades in faded ochre, rose, and cream—cast long, warm reflections that stretch toward the camera. The stillness of the water and the soft, fading light create a scene of suspended calm, as though time itself has slowed to match the pace of the tide.' },
        { id: 'img-26', type: 'image', title: 'Lavender Fields', category: 'Nature', date: '2023-04-22', imageUrl: 'assets/images/img-26.jpg', description: 'Row upon row of lavender stretch across rolling Provençal hillsides, their purple blooms forming rhythmic bands that follow the contours of the land. A single wind-sculpted cypress tree breaks the pattern at the composition\'s edge, its dark vertical form a counterpoint to the soft, horizontal rhythms of the field. Late-afternoon backlight renders the lavender as a luminous violet haze, while distant hills fade into atmospheric blue, compressing miles of landscape into a single, layered frame.' },
        { id: 'img-27', type: 'image', title: 'Rooftop View', category: 'Architecture', date: '2023-03-14', imageUrl: 'assets/images/img-27.jpg', description: 'An urban rooftop vantage point looking out across a dense cityscape of varied rooflines—terra-cotta tiles, flat concrete terraces, water towers, and satellite dishes—all bathed in the warm, raking light of late afternoon. The foreground features a small rooftop garden with potted herbs and a string of bare Edison bulbs, anchoring the viewer in a lived-in, human-scale space before the eye travels outward to the sprawling metropolis beyond.' },
        { id: 'img-28', type: 'image', title: 'Spice Market', category: 'Food', date: '2023-02-28', imageUrl: 'assets/images/img-28.jpg', description: 'A vibrant spice stall where mounds of brilliantly colored powders—turmeric yellow, paprika red, saffron orange, sumac burgundy—are arranged in perfect conical heaps in woven baskets. The vendor\'s hands, stained by years of handling dyestuffs, measure portions with practiced precision. Diffused market light eliminates harsh shadows, allowing every hue to glow with its own intensity. The image is a celebration of culinary color theory, where ingredients double as pigments in an edible palette.' },
        { id: 'img-29', type: 'image', title: 'Coral Reef', category: 'Travel', date: '2023-01-15', imageUrl: 'assets/images/img-29.jpg', description: 'An underwater vista of a healthy coral reef, where branching acropora and massive brain corals form a complex three-dimensional architecture teeming with life. Schools of vividly colored reef fish—parrotfish, angelfish, clownfish—drift between coral heads, their scales catching shafts of sunlight that penetrate the clear turquoise water. The sense of depth and clarity speaks to pristine water quality, while the density of marine life hints at the biodiversity that a single reef can support.' },
        { id: 'img-30', type: 'image', title: 'Neon Alley', category: 'People', date: '2022-12-20', imageUrl: 'assets/images/img-30.jpg', description: 'A narrow alleyway transformed into a canyon of light by layers of overlapping neon signs in Japanese, Chinese, and Korean, their combined glow painting every surface in shifting pools of pink, blue, and electric green. Steam rises from a sidewalk food stall, catching the colored light and turning it into a luminous veil. The dense visual information—text, symbol, reflection, vapor—creates a sensory overload that captures the kinetic energy of nocturnal East Asian street culture.' },
        { id: 'img-31', type: 'image', title: 'Waterfall Mist', category: 'Nature', date: '2022-11-08', imageUrl: 'assets/images/img-31.jpg', description: 'A towering waterfall plunges from a moss-covered cliff into a boulder-strewn pool, the impact generating a permanent cloud of mist that drifts through the surrounding forest. A slow shutter speed renders the falling water as a smooth, ethereal curtain, while the surrounding rocks and ferns remain razor-sharp by contrast. Sunlight filtering through the canopy creates fleeting rainbows in the mist, their arcs visible for seconds before shifting with the breeze.' },
        { id: 'img-32', type: 'image', title: 'Train Platform', category: 'Travel', date: '2022-10-25', imageUrl: 'assets/images/img-32.jpg', description: 'A quiet railway platform in a small town, where a vintage train sits at rest beneath a corrugated iron canopy. The geometry of the parallel tracks, platform edge, and overhead structure creates a strong perspective grid that converges on a vanishing point marked by a distant signal light. A handful of passengers wait in relaxed attitudes, their presence suggesting a slower rhythm of travel that the scene\'s muted, almost painterly color palette reinforces.' },
        { id: 'img-33', type: 'image', title: 'Pottery Studio', category: 'Food', date: '2022-09-12', imageUrl: 'assets/images/img-33.jpg', description: 'Inside a sunlit pottery workshop, shelves of hand-thrown ceramics await their final glaze firing. Wheels, ribs, and wire tools lie scattered across worktables dusted with fine clay powder. A potter\'s hands shape a vessel on the wheel in the background, captured mid-rotation in a blur of motion that contrasts with the stillness of the finished pieces on display. The warm, earthy tones of terracotta, stoneware, and raw clay permeate every surface of the frame.' },
        { id: 'img-34', type: 'image', title: 'Snow Peak', category: 'Nature', date: '2022-08-05', imageUrl: 'assets/images/img-34.jpg', description: 'A jagged alpine summit sheathed in snow and rime ice, photographed from a neighboring ridge under a deep blue winter sky. Wind-scoured cornices trace the ridgeline in sharp relief, while shadows in the couloirs reveal the mountain\'s underlying rock in bands of dark gray and rust. The clarity of the high-altitude atmosphere renders every detail with surgical precision, conveying both the beauty and the intimidating scale of the terrain.' },
        { id: 'img-35', type: 'image', title: 'Vintage Train', category: 'Travel', date: '2022-07-18', imageUrl: 'assets/images/img-35.jpg', description: 'A restored steam locomotive sits at a heritage station, its polished brass fittings and black-lacquered boiler gleaming under diffused light. Steam wisps curl from valves and the smokestack, catching the light in translucent veils. The composition balances the locomotive\'s engineered mass with the gentleness of its rural surroundings—wildflower-dotted embankments and a distant stone viaduct—evoking an era when rail travel was both an engineering marvel and a romantic adventure.' },
        { id: 'img-36', type: 'image', title: 'Silk Weaving', category: 'People', date: '2022-06-30', imageUrl: 'assets/images/img-36.jpg', description: 'An artisan weaver works at a traditional wooden loom, their hands guiding a shuttle through a warp of brilliantly dyed silk threads. The rhythmic geometry of the half-finished fabric—repeating motifs in saffron, crimson, and indigo—contrasts with the organic clutter of the workshop: skeins of yarn hanging from rafters, tea cups on windowsills, a cat dozing on a pile of fabric. The warm interior light emphasizes the tactile richness of the materials.' },
        { id: 'img-37', type: 'image', title: 'Lighthouse Dawn', category: 'Architecture', date: '2022-05-14', imageUrl: 'assets/images/img-37.jpg', description: 'A solitary lighthouse stands on a rocky promontory, its white tower catching the first pink light of dawn while the sea behind remains in blue-gray shadow. The beam, though invisible in the growing light, points outward across a calm expanse of ocean where a single fishing boat leaves a thin wake. The geometric simplicity of the lighthouse form—cylinder, cone, cylinder—gives the composition an almost iconic clarity, while the color contrast between warm and cool light creates visual tension.' },
        { id: 'img-38', type: 'image', title: 'Bamboo Grove', category: 'Nature', date: '2022-04-22', imageUrl: 'assets/images/img-38.jpg', description: 'A dense bamboo forest where towering culms rise vertically from the forest floor, their segmented green shafts creating a natural colonnade that filters the light into a cool, even glow. A narrow stone pathway winds between the stalks, its surface dappled with shifting leaf shadows. The extreme verticality of the composition, combined with the gentle sway of the canopy overhead, induces a meditative calm—the visual equivalent of the sound of wind through bamboo.' },
        { id: 'img-39', type: 'image', title: 'Street Food', category: 'Food', date: '2022-03-08', imageUrl: 'assets/images/img-39.jpg', description: 'A bustling night food stall wreathed in fragrant smoke, where skewers of marinated meat sizzle over glowing charcoal coals. The vendor\'s hands move with practiced speed, turning and basting in a rhythm perfected over years of repetition. Sparks fly upward into the darkness as fat drips onto the coals. The warm, directional light of a bare bulb overhead creates a chiaroscuro effect, isolating the stall and its offerings against the anonymous darkness of the street behind.' },
        { id: 'img-40', type: 'image', title: 'Canal Houses', category: 'Architecture', date: '2022-02-16', imageUrl: 'assets/images/img-40.jpg', description: 'A row of narrow, gabled canal houses reflected in the dark, still water of an urban waterway. Their facades—centuries-old brickwork in tones of burnt sienna, umber, and deep red—are ornamented with tall windows, decorative shutters, and wrought-iron anchors. A stone bridge arches gracefully across the foreground, its underside forming a dark frame that focuses attention on the architectural rhythm of the row. The scene captures the enduring elegance of cities built around their waterways.' },
        { id: 'img-41', type: 'image', title: 'Foggy Bridge', category: 'Travel', date: '2022-01-25', imageUrl: 'assets/images/img-41.jpg', description: 'An arched stone bridge disappears into dense fog on both sides, its damp parapets glistening with moisture and the merest hint of green algae. A single lamp at the bridge\'s apex emits a diffused halo of warm light that barely penetrates the surrounding whiteout. The extreme reduction of visual information—the fog erasing all context beyond a few meters—transforms a familiar structure into something mysterious and slightly disorienting, a liminal space between here and nowhere.' },
        { id: 'img-42', type: 'image', title: 'Ceramic Bowls', category: 'Food', date: '2021-12-10', imageUrl: 'assets/images/img-42.jpg', description: 'A collection of handmade ceramic bowls arranged on a rough linen cloth, each piece uniquely shaped and glazed in a palette of muted earth tones—ash gray, celadon green, tenmoku brown, and shino white. The wabi-sabi aesthetic celebrates irregular edges, crackled glazes, and the subtle evidence of the maker\'s hand. Soft, directional light from a north-facing window models each bowl\'s volume with gentle shadows, creating a still-life composition that honors the quiet beauty of functional craft.' },
        { id: 'img-43', type: 'image', title: 'Cliff Walk', category: 'Nature', date: '2021-11-05', imageUrl: 'assets/images/img-43.jpg', description: 'A dramatic coastal path carved into the face of sheer limestone cliffs, with a sheer drop to turquoise water below. The trail narrows to a guarded walkway that clings to the rock face, offering vertiginous views of sea caves and rock arches carved by millennia of wave action. Sunlight strikes the cliff face at a low angle, warming the pale stone to a honey gold, while the sea below deepens from aquamarine near shore to dark sapphire at the horizon.' },
        { id: 'img-44', type: 'image', title: 'Night Market', category: 'People', date: '2021-10-18', imageUrl: 'assets/images/img-44.jpg', description: 'A crowded night market in full swing, its narrow lanes a river of people flowing between stalls hung with paper lanterns, silk lanterns, and strings of bare bulbs. Vendors call out prices and stir steaming woks, their faces illuminated by the warm glow of cooking fires and electric lights. The high-angle composition captures the market\'s density and energy—the overlapping textures of awnings, signs, steam, and the ever-moving crowd—creating a scene that engages every sense.' },
        { id: 'img-45', type: 'image', title: 'Terraced Fields', category: 'Nature', date: '2021-09-22', imageUrl: 'assets/images/img-45.jpg', description: 'Ancient rice terraces carved into steep hillsides, their flooded paddies reflecting the sky in a mosaic of mirrored surfaces at different elevations. Each terrace is bounded by a low mud wall, their cumulative effect forming a monumental staircase that climbs from valley floor to mountain ridge. A single farmer is visible in the middle distance, a diminutive figure that provides scale and underscores the enormous human labor embedded in this sculpted agricultural landscape over generations.' },
        { id: 'img-46', type: 'image', title: 'Abstract Light', category: 'Architecture', date: '2021-08-30', imageUrl: 'assets/images/img-46.jpg', description: 'An intentional camera movement transforms a modern building\'s facade into an abstract composition of vertical color bands—copper, glass-blue, charcoal, and pale gold—that blur and bleed into one another like watercolor strokes on wet paper. The technique strips the architecture of its literal identity, leaving only the essential chromatic and tonal qualities of its materials. The result occupies an ambiguous space between photography and painting, documentation and interpretation.' },
        { id: 'img-47', type: 'image', title: 'Rain Window', category: 'People', date: '2021-07-14', imageUrl: 'assets/images/img-47.jpg', description: 'Through a rain-streaked window, a softly focused cityscape blurs into an impressionistic wash of color—amber streetlights, pale building facades, the dark silhouettes of bare trees. Water droplets on the glass act as tiny lenses, inverting and magnifying fragments of the scene beyond. A hand reaches toward the glass in the foreground, its reflection mingling with the world outside. The image captures the particular melancholy and intimacy of watching rain from a warm interior.' },
        { id: 'img-48', type: 'image', title: 'Golden Temple', category: 'Travel', date: '2021-06-01', imageUrl: 'assets/images/img-48.jpg', description: 'A gilded temple pagoda glows with almost supernatural warmth against a deep cerulean sky, its multiple tiers crowned with ornate finials that catch the light like concentrated sunbeams. Intricate relief carvings—devotional figures, lotus blossoms, and mythical creatures—adorn every surface, their details sharp in the clear, high-altitude light. A stone courtyard in the foreground provides a quiet, earthly counterpoint to the celestial gleam above, grounding the sacred architecture in the daily life of pilgrims and visitors.' },

        { id: 'card-6', type: 'card', title: 'Restaurant Branding', category: 'Branding', date: '2024-10-08', description: 'Holistic brand experience for a modern Asian fusion restaurant. Menu design, signage, packaging, and social media templates unified under one cohesive visual system. The identity draws from Japanese wabi-sabi aesthetics mixed with contemporary minimalism, using a custom typeface pairing of Noto Serif JP and Space Grotesk. Deliverables included 200+ asset variations across print, digital, and environmental applications, plus a 60-page brand guidelines document.' },

        { id: 'card-11', type: 'card', title: 'Music Festival Poster', category: 'Design', date: '2024-05-15', description: 'Vibrant poster series for an international music festival. Bold typography meets psychedelic illustration, inspired by vintage concert posters with a modern twist. Each poster in the 8-piece series features a different headliner rendered in a distinct color palette derived from the artist\'s album artwork, while maintaining visual cohesion through a shared grid system and typographic hierarchy. Printed as limited-edition screen prints on archival cotton paper.' },

        { id: 'card-29', type: 'card', title: 'Festival Branding', category: 'Branding', date: '2022-11-08', description: 'Identity system for a three-day electronic music and digital arts festival. Generative logo that mutates daily using weather and ticket sales data as seeds, applied across lanyards, stage visuals, AR wayfinding overlays, and a companion app with personalized schedule building and proximity-based social features.' },

        { id: 'card-37', type: 'card', title: 'Payment SDK', category: 'Development', date: '2022-03-15', description: 'Lightweight payment SDK supporting card tokenization, 3D Secure 2.0, Apple Pay, Google Pay, and bank redirects across 35 countries. The entire integration surface is a single 18KB gzipped JavaScript bundle with zero runtime dependencies, tree-shakeable modules, and automatic fallback from the modern Payment Request API to custom card form rendering.' },
        { id: 'card-38', type: 'card', title: 'Coffee Packaging', category: 'Branding', date: '2022-02-08', description: 'Single-origin coffee packaging with a rotational illustration system where each bag features a different artist interpreting the terroir of the beans inside, creating a collectible series. The structural design uses a compostable plant-based film with a resealable ziplock, and the inner pouch is printed with brewing instructions specific to each roast profile.' },
        { id: 'card-39', type: 'card', title: 'Design Tokens', category: 'Development', date: '2022-01-20', description: 'Design token pipeline that transforms a single source of truth YAML into platform-specific outputs: CSS custom properties, Swift UIColor extensions, Kotlin color resources, and Figma plugin variables. Supports semantic aliasing, theme overrides, and automatic documentation generation with rendered previews for each token.' },

        { id: 'card-42', type: 'card', title: 'Fashion Rebrand', category: 'Branding', date: '2021-10-08', description: 'Sustainable fashion brand repositioning from mass-market to premium artisanal. New identity centered on hand-drawn botanical illustrations, a muted earth-tone palette derived from natural dyes, and packaging made from recycled cotton rag paper with soy-based inks. The tag system uses garment-specific care symbols redesigned as minimalist line art.' },

        { id: 'card-45', type: 'card', title: 'CRM Dashboard', category: 'Development', date: '2021-07-10', description: 'Sales CRM with pipeline visualization, contact timeline, and AI-powered lead scoring using gradient-boosted decision trees trained on historical conversion data. The activity feed aggregates emails, calls, and meeting notes into a unified chronological view with entity extraction for automatic deal field updates. Real-time collaboration via operational transform on shared deal records.' },

      ];

      function getResponsiveImageSources(imageUrl) {
        var lastDot = imageUrl.lastIndexOf('.');
        var basePath = imageUrl.slice(0, lastDot);
        var fileName = basePath.slice(basePath.lastIndexOf('/') + 1);
        var responsiveBase = 'assets/images/responsive/' + fileName;
        return {
          avif800: responsiveBase + '-800.avif',
          avif1200: responsiveBase + '-1200.avif',
          webp800: responsiveBase + '-800.webp',
          webp1200: responsiveBase + '-1200.webp',
          jpg800: responsiveBase + '-800.jpg',
          jpg1200: responsiveBase + '-1200.jpg'
        };
      }

      function formatDate(dateStr) {
        var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        var parts = dateStr.split('-');
        return months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
      }

      function render() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        var container = document.getElementById('detailContent');

        if (!id) {
          renderNotFound(container);
          return;
        }

        var item = DATA.find(function (d) { return d.id === id; });
        if (!item) {
          renderNotFound(container);
          return;
        }

        document.title = item.title;

        if (item.type === 'image') {
          renderImageDetail(container, item);
        } else {
          renderCardDetail(container, item);
        }
      }

      function renderNotFound(container) {
        container.innerHTML =
          '<div class="not-found">' +
            '<h2>Item not found</h2>' +
            '<a href="index.html">Return to gallery</a>' +
          '</div>';
        container.style.justifyContent = 'center';
      }

      function renderImageDetail(container, item) {
        var sources = getResponsiveImageSources(item.imageUrl);
        var sizes = '100vw';

        container.innerHTML =
          '<div class="detail-image-wrap">' +
            '<picture>' +
              '<source type="image/avif" srcset="' + sources.avif800 + ' 800w, ' + sources.avif1200 + ' 1200w" sizes="' + sizes + '">' +
              '<source type="image/webp" srcset="' + sources.webp800 + ' 800w, ' + sources.webp1200 + ' 1200w" sizes="' + sizes + '">' +
              '<img src="' + sources.jpg1200 + '" srcset="' + sources.jpg800 + ' 800w, ' + sources.jpg1200 + ' 1200w" sizes="' + sizes + '" alt="' + item.title + '">' +
            '</picture>' +
          '</div>' +
          '<div class="detail-info">' +
            '<h1>' + item.title + '</h1>' +
            '<div class="detail-meta">' +
              '<span class="tag">' + item.category + '</span>' +
              '<span class="date">' + formatDate(item.date) + '</span>' +
            '</div>' +
            (item.description ? '<p class="description">' + item.description + '</p>' : '') +
          '</div>';
      }

      function renderCardDetail(container, item) {
        container.style.justifyContent = 'flex-start';
        container.innerHTML =
          '<div class="detail-text-wrap">' +
            '<h1>' + item.title + '</h1>' +
            '<div class="detail-meta">' +
              '<span class="tag">' + item.category + '</span>' +
              '<span class="date">' + formatDate(item.date) + '</span>' +
            '</div>' +
            '<p class="description">' + item.description + '</p>' +
          '</div>';
      }

      document.getElementById('backBtn').addEventListener('click', function () {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      });

      render();
    })();
  </script>
</body>
